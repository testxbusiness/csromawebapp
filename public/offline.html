<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d71920" />
    <title>CSRoma — Offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f7fb; color: #0f172a; }
      @media (prefers-color-scheme: dark) { :root { background: #0b1220; color: #e5e7eb; } }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 460px); padding: 32px 24px; text-align: center; border: 1px solid #e5e7eb; border-radius: 20px; background: #fff; box-shadow: 0 10px 20px rgba(0,0,0,.08); }
      @media (prefers-color-scheme: dark) { main { border-color: #1f2937; background: #0f172a; } }
      img { width: 128px; height: 128px; object-fit: contain; margin: 0 auto 20px; }
      h1 { margin: 0 0 12px; font-size: 1.5rem; }
      p { margin: 0 0 24px; line-height: 1.5; color: #475569; }
      @media (prefers-color-scheme: dark) { p { color: #9ca3af; } }
      button { border: 0; border-radius: 12px; padding: 12px 18px; background: #d71920; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="CSRoma" />
      <h1>Connessione assente</h1>
      <p>CSRoma tornerà disponibile quando il dispositivo sarà nuovamente online.</p>
      <button type="button" onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>
